name: Build Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare Windows binaries directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path resources/bin | Out-Null
          Write-Host "resources/bin ready"

      - name: Download ffmpeg (libass build)
        shell: pwsh
        run: |
          $ffmpegZip = "$env:TEMP\ffmpeg.zip"
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile $ffmpegZip
          Expand-Archive -Path $ffmpegZip -DestinationPath "$env:TEMP\ffmpeg" -Force
          $ffmpegBin = Get-ChildItem -Path "$env:TEMP\ffmpeg" -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          $ffprobeBin = Get-ChildItem -Path "$env:TEMP\ffmpeg" -Recurse -Filter "ffprobe.exe" | Select-Object -First 1
          Copy-Item $ffmpegBin.FullName "resources/bin/ffmpeg.exe" -Force
          Copy-Item $ffprobeBin.FullName "resources/bin/ffprobe.exe" -Force
          Write-Host "ffmpeg and ffprobe installed"

      - name: Download yt-dlp
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile "resources/bin/yt-dlp.exe"
          Write-Host "yt-dlp installed"

      - name: Build whisper-cli from whisper.cpp (Windows)
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/ggml-org/whisper.cpp.git vendor/whisper.cpp
          cmake -S vendor/whisper.cpp -B vendor/whisper.cpp/build -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=ON -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_SERVER=OFF
          cmake --build vendor/whisper.cpp/build --config Release --parallel

          $candidates = @(
            "vendor/whisper.cpp/build/bin/Release/whisper-cli.exe",
            "vendor/whisper.cpp/build/bin/Release/main.exe",
            "vendor/whisper.cpp/build/Release/whisper-cli.exe",
            "vendor/whisper.cpp/build/Release/main.exe"
          )
          $found = $null
          foreach ($c in $candidates) {
            if (Test-Path $c) {
              $found = Get-Item $c
              break
            }
          }
          if (-not $found) {
            Write-Host "whisper-cli.exe not found in expected paths, searching..."
            $found = Get-ChildItem -Path vendor/whisper.cpp/build -Recurse -Include "whisper-cli.exe","main.exe" | Select-Object -First 1
          }
          if (-not $found) {
            throw "Could not find built whisper-cli.exe"
          }
          Copy-Item $found.FullName "resources/bin/whisper-cli.exe" -Force
          Write-Host "whisper-cli installed from $($found.FullName)"

          # whisper-cli.exe 依赖同目录的 whisper.dll / ggml*.dll，必须一起打包
          $binDir = Split-Path $found.FullName -Parent
          Get-ChildItem -Path $binDir -Filter "*.dll" -File | ForEach-Object {
            Copy-Item $_.FullName "resources/bin/" -Force
            Write-Host "copied dll: $($_.Name)"
          }

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pyinstaller

      - name: Bundle MSVC runtime DLLs for whisper
        shell: pwsh
        run: |
          # whisper.cpp 的 ggml/whisper DLL 依赖 MSVC 运行时 + OpenMP(vcomp140)
          # 必须与 whisper-cli.exe 放在同一目录，否则子进程可能找不到
          $names = @("vcomp140.dll", "vcruntime140.dll", "vcruntime140_1.dll", "msvcp140.dll")
          foreach ($n in $names) {
            $src = Join-Path "C:\Windows\System32" $n
            if (Test-Path $src) {
              Copy-Item $src "resources/bin/$n" -Force
              Write-Host "bundled $n"
            } else {
              Write-Host "WARN: $n not found in System32"
            }
          }

      - name: Run Windows build script
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/build_windows.ps1

      - name: Create zip artifact
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/VideoBridge/*" -DestinationPath "VideoBridge-windows.zip" -Force
          Get-ChildItem -Path "dist/VideoBridge" -Recurse | Select-Object FullName, Length | Select-Object -First 20

      - name: Publish to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ref = "${{ github.ref_name }}"
          if ($ref -like "v*") { $tag = $ref } else { $tag = "windows-latest" }
          $notes = "Auto build from commit ${{ github.sha }} (run ${{ github.run_id }})"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "VideoBridge Windows ($tag)" --notes $notes
          } else {
            gh release edit $tag --notes $notes
          }
          gh release upload $tag "VideoBridge-windows.zip" --clobber
          Write-Host "Release: https://github.com/${{ github.repository }}/releases/tag/$tag"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoBridge-Windows
          path: |
            VideoBridge-windows.zip
            dist/VideoBridge/*
